<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AI 피부 분석 모드</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fdfc;
            display: flex;
            justify-content: center;
            min-height: 100dvh;
        }

        .app-container {
            width: 100%;
            max-width: 375px;
            min-height: 100dvh;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            position: relative;
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* 메인 콘텐츠 영역 */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .ai-image-container {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            overflow: hidden;
            margin-bottom: 20px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ai-image-container img {
            width: 75%;
            height: 75%;
            object-fit: cover;
        }

        .ai-image-container:hover img {
            filter: blur(0);
        }

        .content h2 {
            font-size: 22px;
            font-weight: 700;
            color: #111111;
        }

        .content p {
            margin: 10px 0 30px;
            color: #666666;
            font-size: 14px;
            text-align: center;
        }

        .btn-analyze {
            background-color: #A3D9C9;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-analyze:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>

    <div class="app-container">



        <div class="content">
            <div class="ai-image-container">
                <img src="./images/logo.png.png" alt="AI 분석">
            </div>

            <h2>피부 분석 시작하기</h2>
            <p>내 피부 고민을 AI가 진단해 드려요.</p>

            <button class="btn-analyze" onclick="startAnalysis()">분석 시작</button>
        </div>

    </div>

    <script>
        function startAnalysis() {
            alert("피부 분석을 시작합니다!");
        }
    </script>

</body>

</html>
